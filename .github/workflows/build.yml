name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Backup main.dart
        run: |
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/main.dart

      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --project-name=air_drum_app --overwrite

      - name: Restore main.dart
        run: |
          cp temp_backup/main.dart lib/main.dart

      - name: Configure Android SDK versions
        run: |
          PROPERTIES_FILE="android/gradle.properties"
          echo "flutter.minSdkVersion=21" >> $PROPERTIES_FILE
          echo "flutter.compileSdkVersion=34" >> $PROPERTIES_FILE
          echo "flutter.targetSdkVersion=34" >> $PROPERTIES_FILE

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
