name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Backup main.dart
        run: |
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/main.dart

      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --project-name=air_drum_app --overwrite

      - name: Restore main.dart
        run: |
          cp temp_backup/main.dart lib/main.dart

      - name: Configure Android SDK via Python
        run: |
          python3 -c '
          import re
          path = "android/app/build.gradle"
          with open(path, "r") as f:
              content = f.read()
          content = re.sub(r"minSdkVersion\s+.*", "minSdkVersion 21", content)
          content = re.sub(r"compileSdkVersion\s+.*", "compileSdkVersion 34", content)
          content = re.sub(r"targetSdkVersion\s+.*", "targetSdkVersion 34", content)
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
