name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Backup Custom Files
        run: |
          mkdir -p temp_backup
          cp lib/main.dart temp_backup/main.dart
          cp pubspec.yaml temp_backup/pubspec.yaml

      - name: Generate Android Platform Files
        run: flutter create . --platforms=android --project-name=air_drum_app --overwrite

      - name: Restore Custom Files
        run: |
          cp temp_backup/main.dart lib/main.dart
          cp temp_backup/pubspec.yaml pubspec.yaml

      - name: Force Android SDK 34 and Namespace
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          
          # Adiciona o namespace se não existir
          if ! grep -q "namespace" "$BUILD_GRADLE"; then
            sed -i '/android {/a \    namespace "com.example.air_drum_app"' "$BUILD_GRADLE"
          fi
          
          # Força as versões para 34 de forma limpa
          sed -i 's/minSdkVersion.*/minSdkVersion 21/g' "$BUILD_GRADLE"
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/g' "$BUILD_GRADLE"
          sed -i 's/targetSdkVersion.*/targetSdkVersion 34/g' "$BUILD_GRADLE"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
